# mole configuration
#
# Default search path: $XDG_CONFIG_HOME/mole/config.toml
#                      (falls back to ~/.config/mole/config.toml)
#
# The running daemon watches this file and hot-reloads it on save.

[keys]
# Keys used to build the 2-character hint labels. Order matters: the first
# characters of the alphabet are assigned to the top-left elements.
hint_alphabet = "asdfghjkl"

# Directional movement keys for `mole move`. Default to hjkl; set them to any
# keys you prefer (letters or punctuation), e.g. "l", ";", "'", "\\".
move_left = "h"
move_down = "j"
move_up = "k"
move_right = "l"

# Free-move action keys. The pointer glides over the live desktop; these act at
# wherever it rests. "space" is accepted as a key name.
speed_boost = "space"   # hold to glide faster
left_click = "f"
right_click = "d"
double_click = "s"
drag = "a"              # tap to start a drag, tap again to drop it (copies the selection)

[movement]
# Free-move glides like a real mouse rather than jumping a fixed step.
# Glide speed (px/second) the moment a direction is pressed: the base
# sensitivity for fine positioning. Raise for a faster pointer.
speed = 700.0
# Hard ceiling (px/second) the glide accelerates to while a direction is held.
max_speed = 3200.0
# Speed multiplier applied per second a direction stays held, so the pointer
# glides faster the longer you hold it. 1.0 disables acceleration.
acceleration = 3.0
# Speed multiplier while the speed_boost key is held. 1.0 disables the boost.
boost = 2.5

[hints]
# RGBA (0-255). Background of a hint label box.
background = [255, 220, 90, 230]
# Text colour.
foreground = [20, 20, 20, 255]
# Text colour drawn when the box sits on a bright background (adaptive contrast).
foreground_dark = [240, 240, 240, 255]
# Box that has been partially matched by the keys typed so far.
matched = [120, 220, 120, 230]
font_family = "monospace"
font_size = 13.0
# Minimum gap (px) enforced between two hint boxes by the anti-overlap pass.
min_gap = 4
# How much to darken the frozen screenshot painted behind the hints
# (0.0 = the screen as-is, 1.0 = black). A little dim makes the labels pop
# while keeping the desktop clearly visible so you can see where you're jumping.
dim = 0.2

[ocr]
# Path/name of the tesseract binary that reads the screen.
binary = "tesseract"
language = "eng"
# Minimum Tesseract confidence (0-100) for a word to be kept. Raise to drop
# shaky guesses; lower to catch faint text.
min_confidence = 50.0
# Ignore phrase boxes smaller than this many pixels on either axis (noise).
min_element_size = 6
# How readily neighbouring words merge into one phrase target: the max horizontal
# gap between two words, as a multiple of their text height. Higher = longer
# phrases / fewer hints; lower = more, shorter targets.
max_word_gap = 1.0
# How strict "same line" is: two words share a line when their vertical centres
# differ by at most this fraction of their text height.
line_tolerance = 0.5
# How many horizontal strips to split the screen into and OCR in parallel.
# Tesseract is single-threaded per image, so on a multi-core machine this is a
# big speed lever: 4 roughly halves a full scan on a wide display. More isn't
# always better: each strip is a separate tesseract process with fixed startup
# cost, so too many strips adds overhead. Set to 1 to disable tiling.
tiles = 4
# Keep the OCR cache warm in the background: watch the screen (X DAMAGE) and
# re-read only the strips that change, once it settles. A hint on a screen you've
# been looking at then needs no OCR and appears instantly. Costs a little CPU
# while the screen is changing; set false to OCR purely on demand.
prewarm = true
# Hint every individual word (true) so every word (including the ends of lines)
# is reachable. Set false to hint whole phrases instead (fewer labels, but you
# only land at the start of each phrase). Drag selection always works on phrases,
# so a whole sentence stays selectable either way.
hint_words = true
# Also hint icon-only clickable things with no text (toolbar buttons, tab
# favicons, window controls) found from the pixels. true by default; set false
# for text-only hints. Heuristic, so it may add the odd stray hint on a busy image.
hint_icons = true

[daemon]
# Unix socket the daemon listens on. The CLI talks to it over this socket.
# Defaults to $XDG_RUNTIME_DIR/mole.sock when unset.
# socket = "/run/user/1000/mole.sock"
